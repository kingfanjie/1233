<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🎁 光遇 · 生日礼物</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e1a;
            font-family: 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
            touch-action: manipulation;
            /* 禁止双击缩放 */;
        }

        /* ===== 容器占满屏幕 ===== */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0e1a;
        }

        /* ===== 图片容器 ===== */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0e1a;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 充盈屏幕，锁定比例 */
            object-position: center center;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            z-index: 1;
        }

        /* ===== 光晕叠加层 ===== */
        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .glow-gold {
            position: absolute;
            width: 60%;
            height: 60%;
            top: 10%;
            right: -10%;
            background: radial-gradient(circle, rgba(247, 183, 49, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: breathe 5s ease-in-out infinite alternate;
        }
        .glow-purple {
            position: absolute;
            width: 50%;
            height: 50%;
            bottom: 5%;
            left: -10%;
            background: radial-gradient(circle, rgba(124, 77, 255, 0.20) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: breathe 6s ease-in-out infinite alternate-reverse;
        }
        .glow-warm {
            position: absolute;
            width: 40%;
            height: 40%;
            top: 40%;
            left: 30%;
            background: radial-gradient(circle, rgba(255, 200, 120, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            animation: breathe 7s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 光点 ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px 2px rgba(247, 183, 49, 0.3);
            animation: sparkleAnim var(--dur, 3s) ease-in-out infinite alternate;
            pointer-events: none;
        }
        .sparkle:nth-child(1) {
            width: 6px;
            height: 6px;
            top: 12%;
            left: 8%;
            --dur: 2.8s;
            animation-delay: 0.2s;
        }
        .sparkle:nth-child(2) {
            width: 4px;
            height: 4px;
            top: 25%;
            right: 15%;
            --dur: 3.6s;
            animation-delay: 0.8s;
            box-shadow: 0 0 10px 1px rgba(124, 77, 255, 0.4);
        }
        .sparkle:nth-child(3) {
            width: 5px;
            height: 5px;
            top: 55%;
            left: 20%;
            --dur: 4.2s;
            animation-delay: 0.5s;
        }
        .sparkle:nth-child(4) {
            width: 3px;
            height: 3px;
            top: 70%;
            right: 25%;
            --dur: 3.0s;
            animation-delay: 1.2s;
            box-shadow: 0 0 8px 1px rgba(247, 183, 49, 0.5);
        }
        .sparkle:nth-child(5) {
            width: 7px;
            height: 7px;
            top: 40%;
            left: 65%;
            --dur: 3.8s;
            animation-delay: 0.1s;
        }
        .sparkle:nth-child(6) {
            width: 4px;
            height: 4px;
            top: 15%;
            left: 45%;
            --dur: 4.5s;
            animation-delay: 1.5s;
            box-shadow: 0 0 12px 2px rgba(255, 200, 120, 0.3);
        }
        .sparkle:nth-child(7) {
            width: 5px;
            height: 5px;
            bottom: 20%;
            left: 10%;
            --dur: 3.2s;
            animation-delay: 0.9s;
        }
        .sparkle:nth-child(8) {
            width: 3px;
            height: 3px;
            bottom: 30%;
            right: 8%;
            --dur: 4.0s;
            animation-delay: 0.4s;
            box-shadow: 0 0 8px 1px rgba(124, 77, 255, 0.3);
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0.15;
                transform: scale(0.6);
            }
            100% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* ===== 光之翼装饰 ===== */
        .wing-deco {
            position: absolute;
            font-size: 40px;
            opacity: 0.08;
            pointer-events: none;
            animation: floatWing 12s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(247, 183, 49, 0.1));
        }
        .wing-deco.left {
            left: 5%;
            bottom: 20%;
            transform: rotate(-15deg);
            animation-delay: 0s;
        }
        .wing-deco.right {
            right: 5%;
            bottom: 20%;
            transform: rotate(15deg) scaleX(-1);
            animation-delay: 3s;
        }

        @keyframes floatWing {
            0% {
                transform: translateY(0px) scale(1) rotate(-15deg);
                opacity: 0.06;
            }
            50% {
                opacity: 0.12;
            }
            100% {
                transform: translateY(-20px) scale(1.05) rotate(-15deg);
                opacity: 0.06;
            }
        }

        /* ===== 底部文字区域（无按钮） ===== */
        .bottom-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 28px 24px 32px;
            background: linear-gradient(to top,
                    rgba(11, 14, 26, 0.85) 0%,
                    rgba(11, 14, 26, 0.50) 50%,
                    transparent 100%);
            text-align: center;
            pointer-events: none;
            /* 让点击穿透，便于触发全屏 */;
        }

        .bottom-area .main-text {
            display: block;
            font-size: clamp(20px, 5.5vw, 44px);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(247, 183, 49, 0.25), 0 0 60px rgba(247, 183, 49, 0.10), 0 4px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            line-height: 1.5;
            animation: textGlow 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bottom-area .main-text .highlight {
            background: linear-gradient(135deg, #f7b731, #f5a623, #f7b731);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(247, 183, 49, 0.25));
            animation: highlightPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 20px rgba(247, 183, 49, 0.15), 0 4px 20px rgba(0, 0, 0, 0.4);
            }
            100% {
                text-shadow: 0 0 40px rgba(247, 183, 49, 0.30), 0 4px 30px rgba(0, 0, 0, 0.6);
            }
        }

        @keyframes highlightPulse {
            0% {
                filter: drop-shadow(0 0 10px rgba(247, 183, 49, 0.15));
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(247, 183, 49, 0.40));
            }
        }

        .bottom-area .sub-deco {
            display: block;
            margin-top: 8px;
            font-size: clamp(12px, 2vw, 18px);
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 8px;
            font-weight: 300;
            pointer-events: none;
        }

        .bottom-area .sub-deco span {
            display: inline-block;
            animation: shimmerDeco 3s ease-in-out infinite;
        }

        @keyframes shimmerDeco {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ===== 响应式：自适应所有屏幕 ===== */
        @media (orientation: portrait) {
            .bottom-area {
                padding: 20px 20px 28px;
            }
            .bottom-area .main-text {
                font-size: clamp(18px, 5vw, 34px);
            }
            .wing-deco {
                font-size: 28px;
            }
            .wing-deco.left {
                left: 2%;
                bottom: 15%;
            }
            .wing-deco.right {
                right: 2%;
                bottom: 15%;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .bottom-area {
                padding: 12px 20px 16px;
            }
            .bottom-area .main-text {
                font-size: clamp(14px, 3.5vw, 28px);
            }
            .bottom-area .sub-deco {
                font-size: 10px;
                margin-top: 4px;
            }
            .wing-deco {
                font-size: 24px;
            }
            .wing-deco.left {
                bottom: 10%;
            }
            .wing-deco.right {
                bottom: 10%;
            }
            .sparkle {
                display: none;
            }
            .glow-gold,
            .glow-purple,
            .glow-warm {
                filter: blur(40px);
            }
        }

        @media (max-width: 360px) {
            .bottom-area .main-text {
                font-size: clamp(16px, 4.5vw, 22px);
            }
            .bottom-area {
                padding: 16px 14px 20px;
            }
        }

        /* ===== 渐显动画 ===== */
        .fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .fade-in-d1 {
            animation-delay: 0.2s;
        }
        .fade-in-d2 {
            animation-delay: 0.5s;
        }
        .fade-in-d3 {
            animation-delay: 0.8s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== 全屏模式下的额外适配 ===== */
        .container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }
        .container:-moz-full-screen {
            width: 100vw;
            height: 100vh;
        }
        .container:fullscreen {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="container" id="container">

        <div class="image-wrapper">

            <!-- ===== 你的图片（Base64 嵌入） ===== -->
            <img
            id="giftImage"
            src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYdahqcUkBIVL4zAWSLDLphJoRttjqAgAChCYAApvPiVcR6U45xlTQdT0E.png"
			alt="光遇 · 生日"
            />

            <!-- ===== 光效叠加层 ===== -->
            <div class="overlay fade-in fade-in-d1">
                <div class="glow-gold"></div>
                <div class="glow-purple"></div>
                <div class="glow-warm"></div>

                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>

                <div class="wing-deco left fade-in fade-in-d2">🕊️</div>
                <div class="wing-deco right fade-in fade-in-d2">🕊️</div>
            </div>

            <!-- ===== 底部文字（无按钮） ===== -->
            <div class="bottom-area fade-in fade-in-d3">
                <span class="main-text">
                    少抽烟少熬夜，<br />
                    <span class="highlight">远哥哥生日快乐！！</span>
                </span>
                <span class="sub-deco">
                    <span>✦</span> 光 遇 之 旅 · 星 翼 为 伴 <span>✦</span>
                </span>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // 1. 全屏 & 横屏锁定（需用户手势触发）
        // ============================================================
        const container = document.getElementById('container');

        function enterFullscreenAndLock() {
            // 全屏
            if (document.fullscreenElement) {
                // 已全屏则直接锁定方向
                lockOrientation();
                return;
            }
            if (container.requestFullscreen) {
                container.requestFullscreen().then(() => {
                    lockOrientation();
                }).catch(err => {
                    console.warn('全屏请求被拒绝:', err);
                });
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
                // 部分浏览器不支持 Promise，延迟锁方向
                setTimeout(lockOrientation, 500);
            } else {
                // 不支持全屏，直接尝试锁方向
                lockOrientation();
            }
        }

        function lockOrientation() {
            // 锁定横屏
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => {
                    // 某些浏览器不支持或拒绝，忽略
                    console.warn('横屏锁定失败:', err);
                });
            } else if (screen.lockOrientation) {
                // 旧版 Android 浏览器
                screen.lockOrientation('landscape');
            }
        }

        // 点击页面任意位置触发全屏 & 横屏
        document.addEventListener('click', function(e) {
            // 如果已经全屏，则只锁方向（可能已锁定）
            if (document.fullscreenElement) {
                lockOrientation();
                return;
            }
            enterFullscreenAndLock();
        });

        // 触摸设备兼容
        document.addEventListener('touchend', function(e) {
            // 防止重复触发
            if (!document.fullscreenElement) {
                enterFullscreenAndLock();
            }
        }, { passive: true });

        // ============================================================
        // 2. 点击光点特效（保留趣味交互）
        // ============================================================
        document.addEventListener('click', function(e) {
            // 如果点击在底部文字区域，依然产生光点
            const dot = document.createElement('div');
            dot.style.cssText = `
                    position: fixed;
                    pointer-events: none;
                    z-index: 999;
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                    background: radial-gradient(circle, rgba(247,183,49,0.6), transparent 70%);
                    left: ${e.clientX - 10}px;
                    top: ${e.clientY - 10}px;
                    transform: scale(0);
                    animation: clickGlow 0.8s ease-out forwards;
                `;
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 900);
        });

        // 注入点击动画
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
                @keyframes clickGlow {
                    0% { transform: scale(0); opacity: 1; }
                    100% { transform: scale(4); opacity: 0; }
                }
            `;
        document.head.appendChild(styleSheet);

        // ============================================================
        // 3. 禁止滚动
        // ============================================================
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // ============================================================
        // 4. 控制台彩蛋
        // ============================================================
        console.log('✨ 光遇 · 生日礼物 ✨');
        console.log('🎂 祝 远哥哥 生日快乐！');
        console.log('🕯️ 点击屏幕可全屏横屏观看');
    </script>

</body>
</html>
