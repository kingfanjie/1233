<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎁 光遇 · 生日礼物</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0e1a;
            font-family: 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
            touch-action: manipulation;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0e1a;
        }

        /* ===== 图片容器 ===== */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0e1a;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ===== 占位 ===== */
        .image-wrapper .placeholder {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a1e3a, #0b0e1a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
            letter-spacing: 6px;
            z-index: 1;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .image-wrapper img.loaded+.placeholder {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 光晕叠加 ===== */
        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .glow-gold {
            position: absolute;
            width: 60%;
            height: 60%;
            top: 10%;
            right: -10%;
            background: radial-gradient(circle, rgba(247, 183, 49, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: breathe 5s ease-in-out infinite alternate;
        }
        .glow-purple {
            position: absolute;
            width: 50%;
            height: 50%;
            bottom: 5%;
            left: -10%;
            background: radial-gradient(circle, rgba(124, 77, 255, 0.20) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: breathe 6s ease-in-out infinite alternate-reverse;
        }
        .glow-warm {
            position: absolute;
            width: 40%;
            height: 40%;
            top: 40%;
            left: 30%;
            background: radial-gradient(circle, rgba(255, 200, 120, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            animation: breathe 7s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 光点 ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px 2px rgba(247, 183, 49, 0.3);
            animation: sparkleAnim var(--dur, 3s) ease-in-out infinite alternate;
            pointer-events: none;
        }
        .sparkle:nth-child(1) {
            width: 6px;
            height: 6px;
            top: 12%;
            left: 8%;
            --dur: 2.8s;
            animation-delay: 0.2s;
        }
        .sparkle:nth-child(2) {
            width: 4px;
            height: 4px;
            top: 25%;
            right: 15%;
            --dur: 3.6s;
            animation-delay: 0.8s;
            box-shadow: 0 0 10px 1px rgba(124, 77, 255, 0.4);
        }
        .sparkle:nth-child(3) {
            width: 5px;
            height: 5px;
            top: 55%;
            left: 20%;
            --dur: 4.2s;
            animation-delay: 0.5s;
        }
        .sparkle:nth-child(4) {
            width: 3px;
            height: 3px;
            top: 70%;
            right: 25%;
            --dur: 3.0s;
            animation-delay: 1.2s;
            box-shadow: 0 0 8px 1px rgba(247, 183, 49, 0.5);
        }
        .sparkle:nth-child(5) {
            width: 7px;
            height: 7px;
            top: 40%;
            left: 65%;
            --dur: 3.8s;
            animation-delay: 0.1s;
        }
        .sparkle:nth-child(6) {
            width: 4px;
            height: 4px;
            top: 15%;
            left: 45%;
            --dur: 4.5s;
            animation-delay: 1.5s;
            box-shadow: 0 0 12px 2px rgba(255, 200, 120, 0.3);
        }
        .sparkle:nth-child(7) {
            width: 5px;
            height: 5px;
            bottom: 20%;
            left: 10%;
            --dur: 3.2s;
            animation-delay: 0.9s;
        }
        .sparkle:nth-child(8) {
            width: 3px;
            height: 3px;
            bottom: 30%;
            right: 8%;
            --dur: 4.0s;
            animation-delay: 0.4s;
            box-shadow: 0 0 8px 1px rgba(124, 77, 255, 0.3);
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0.15;
                transform: scale(0.6);
            }
            100% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* ===== 光之翼装饰 ===== */
        .wing-deco {
            position: absolute;
            font-size: 40px;
            opacity: 0.08;
            pointer-events: none;
            animation: floatWing 12s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(247, 183, 49, 0.1));
        }
        .wing-deco.left {
            left: 5%;
            bottom: 20%;
            transform: rotate(-15deg);
            animation-delay: 0s;
        }
        .wing-deco.right {
            right: 5%;
            bottom: 20%;
            transform: rotate(15deg) scaleX(-1);
            animation-delay: 3s;
        }

        @keyframes floatWing {
            0% {
                transform: translateY(0px) scale(1) rotate(-15deg);
                opacity: 0.06;
            }
            50% {
                opacity: 0.12;
            }
            100% {
                transform: translateY(-20px) scale(1.05) rotate(-15deg);
                opacity: 0.06;
            }
        }

        /* ===== 底部文字 + 按钮区域 ===== */
        .bottom-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 28px 24px 32px;
            background: linear-gradient(to top,
                    rgba(11, 14, 26, 0.85) 0%,
                    rgba(11, 14, 26, 0.50) 50%,
                    transparent 100%);
            text-align: center;
            pointer-events: none;
            /* 容器本身不拦截点击，内部按钮可点击 */;
        }

        .bottom-area .main-text {
            display: block;
            font-size: clamp(20px, 5.5vw, 44px);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(247, 183, 49, 0.25), 0 0 60px rgba(247, 183, 49, 0.10), 0 4px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            line-height: 1.5;
            animation: textGlow 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bottom-area .main-text .highlight {
            background: linear-gradient(135deg, #f7b731, #f5a623, #f7b731);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(247, 183, 49, 0.25));
            animation: highlightPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 20px rgba(247, 183, 49, 0.15), 0 4px 20px rgba(0, 0, 0, 0.4);
            }
            100% {
                text-shadow: 0 0 40px rgba(247, 183, 49, 0.30), 0 4px 30px rgba(0, 0, 0, 0.6);
            }
        }

        @keyframes highlightPulse {
            0% {
                filter: drop-shadow(0 0 10px rgba(247, 183, 49, 0.15));
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(247, 183, 49, 0.40));
            }
        }

        .bottom-area .sub-deco {
            display: block;
            margin-top: 8px;
            font-size: clamp(12px, 2vw, 18px);
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 8px;
            font-weight: 300;
            pointer-events: none;
        }

        .bottom-area .sub-deco span {
            display: inline-block;
            animation: shimmerDeco 3s ease-in-out infinite;
        }

        @keyframes shimmerDeco {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ===== 打开游戏按钮 ===== */
        .btn-open-game {
            display: inline-block;
            margin-top: 18px;
            padding: 14px 40px;
            border: none;
            border-radius: 60px;
            font-size: clamp(16px, 2.8vw, 24px);
            font-weight: 700;
            color: #0b0e1a;
            background: linear-gradient(135deg, #f7b731, #f5a623);
            box-shadow: 0 8px 30px rgba(247, 183, 49, 0.40);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 2px;
            text-decoration: none;
            touch-action: manipulation;
            user-select: none;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-open-game:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 40px rgba(247, 183, 49, 0.60);
        }

        .btn-open-game:active {
            transform: scale(0.94);
            box-shadow: 0 4px 15px rgba(247, 183, 49, 0.30);
        }

        .btn-open-game .icon {
            display: inline-block;
            margin-right: 8px;
            animation: floatIcon 2s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* 按钮光晕 */
        .btn-open-game::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 60px;
            background: linear-gradient(135deg, #f7b731, #f5a623);
            filter: blur(16px);
            opacity: 0.25;
            z-index: -1;
            animation: btnGlowPulse 2.5s ease-in-out infinite;
        }

        @keyframes btnGlowPulse {
            0%,
            100% {
                opacity: 0.25;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }

        /* ===== 响应式 ===== */
        @media (orientation: portrait) {
            .bottom-area {
                padding: 20px 20px 28px;
            }
            .bottom-area .main-text {
                font-size: clamp(18px, 5vw, 34px);
            }
            .wing-deco {
                font-size: 28px;
            }
            .wing-deco.left {
                left: 2%;
                bottom: 15%;
            }
            .wing-deco.right {
                right: 2%;
                bottom: 15%;
            }
            .btn-open-game {
                padding: 12px 28px;
                font-size: clamp(14px, 4vw, 20px);
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .bottom-area {
                padding: 12px 20px 16px;
            }
            .bottom-area .main-text {
                font-size: clamp(14px, 3.5vw, 28px);
            }
            .bottom-area .sub-deco {
                font-size: 10px;
                margin-top: 4px;
            }
            .btn-open-game {
                margin-top: 10px;
                padding: 10px 24px;
                font-size: clamp(12px, 2.5vw, 18px);
            }
            .wing-deco {
                font-size: 24px;
            }
            .wing-deco.left {
                bottom: 10%;
            }
            .wing-deco.right {
                bottom: 10%;
            }
            .sparkle {
                display: none;
            }
            .glow-gold,
            .glow-purple,
            .glow-warm {
                filter: blur(40px);
            }
        }

        @media (max-width: 360px) {
            .bottom-area .main-text {
                font-size: clamp(16px, 4.5vw, 22px);
            }
            .bottom-area {
                padding: 16px 14px 20px;
            }
            .btn-open-game {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        /* ===== 渐显 ===== */
        .fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .fade-in-d1 {
            animation-delay: 0.2s;
        }
        .fade-in-d2 {
            animation-delay: 0.5s;
        }
        .fade-in-d3 {
            animation-delay: 0.8s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .image-wrapper img.loaded {
            animation: imageReveal 1.2s ease-out both;
        }

        @keyframes imageReveal {
            from {
                opacity: 0;
                transform: scale(1.04);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== 图片容器 ===== -->
        <div class="image-wrapper" id="imageWrapper">

            <!-- 占位 -->
            <div class="placeholder" id="placeholder">
                ✦ 星 光 降 临 ✦
            </div>

            <!-- 横屏图片（仅此一张，无预加载） -->
            <img
            id="giftImage"
            src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYc-dqcTBdPdtehV5LFxbDJk1JzibPOgACfyQAApvPiVe7TrS87kQ9zT0E.png"
            alt="光遇 · 星空"
            crossorigin="anonymous"
            loading="eager"
            />

            <!-- ===== 叠加光效 ===== -->
            <div class="overlay fade-in fade-in-d1">
                <div class="glow-gold"></div>
                <div class="glow-purple"></div>
                <div class="glow-warm"></div>

                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>

                <div class="wing-deco left fade-in fade-in-d2">🕊️</div>
                <div class="wing-deco right fade-in fade-in-d2">🕊️</div>
            </div>

            <!-- ===== 底部文字 + 按钮 ===== -->
            <div class="bottom-area fade-in fade-in-d3">
                <span class="main-text">
                    天下没有白吃的午餐，<br />
                    <span class="highlight">远哥哥生日快乐！！</span>
                </span>
                <span class="sub-deco">
                    <span>✦</span> 光 遇 之 旅 · 星 翼 为 伴 <span>✦</span>
                </span>

                <!-- 打开光遇游戏按钮 -->
                <button class="btn-open-game" id="openGameBtn">
                    <span class="icon">🕯️</span> 打开光遇 · 星翼之旅
                </button>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // 1. 图片加载 —— 仅加载主图，失败时显示占位（无重试）
        // ============================================================
        const img = document.getElementById('giftImage');
        const placeholder = document.getElementById('placeholder');

        function onImageLoaded() {
            img.classList.add('loaded');
            if (placeholder) {
                placeholder.style.transition = 'opacity 0.8s ease';
                placeholder.style.opacity = '0';
                setTimeout(() => {
                    placeholder.style.display = 'none';
                }, 900);
            }
        }

        // 如果图片已加载完成
        if (img.complete && img.naturalWidth > 0) {
            onImageLoaded();
        } else {
            img.addEventListener('load', onImageLoaded);
            img.addEventListener('error', function() {
                // 加载失败，只显示占位文字，不请求其他图片
                if (placeholder) {
                    placeholder.textContent = '✦ 星 光 永 恒 ✦';
                    placeholder.style.opacity = '0.7';
                    placeholder.style.fontSize = '20px';
                }
                // 不设置任何备选图片，避免额外请求
                console.warn('主图片加载失败，显示占位');
            });
        }

        // ============================================================
        // 2. 打开光遇游戏（安卓）
        // ============================================================
        const openBtn = document.getElementById('openGameBtn');

        function openSkyGame() {
            // 光遇国服包名：com.netease.sky
            // 国际服包名：com.tgc.sky.android
            // 这里使用国服包名，如需修改可替换
            const packageName = 'com.netease.sky';

            // 构造 Android Intent URL
            // 直接打开应用（如果已安装）
            const intentUrl = `intent://#Intent;package=${packageName};end;`;

            // 同时准备一个备用链接：跳转应用商店
            const marketUrl = `market://details?id=${packageName}`;

            // 尝试通过 intent 打开
            const startTime = Date.now();
            window.location.href = intentUrl;

            // 设置一个超时检测：如果页面未被切换，说明可能未安装应用，则跳转商店
            setTimeout(() => {
                // 如果页面仍然可见（即未被 intent 切换），则跳转商店
                // 注意：在部分浏览器中，即使应用已安装，也可能不会触发页面隐藏，
                // 但大多数情况下，成功唤起应用会触发页面可见性变化。
                // 这里简单使用一个后备方案：如果 800ms 后还在当前页，则去商店。
                if (!document.hidden) {
                    window.location.href = marketUrl;
                }
            }, 800);
        }

        // 绑定点击事件
        openBtn.addEventListener('click', function(e) {
            e.preventDefault();
            // 按钮反馈
            this.textContent = '✨ 启程中...';
            this.disabled = true;
            this.style.opacity = '0.6';

            openSkyGame();

            // 恢复按钮（但如果跳转了，恢复也无所谓）
            setTimeout(() => {
                this.innerHTML = '<span class="icon">🕯️</span> 打开光遇 · 星翼之旅';
                this.disabled = false;
                this.style.opacity = '1';
            }, 3000);
        });

        // 触摸设备兼容
        openBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            this.click();
        });

        // ============================================================
        // 3. 防止滚动 / 触摸误触
        // ============================================================
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // ============================================================
        // 4. 点击页面任意位置产生光点（趣味交互）
        // ============================================================
        document.addEventListener('click', function(e) {
            // 如果点击的是按钮，不干扰
            if (e.target.closest('.btn-open-game')) return;

            const dot = document.createElement('div');
            dot.style.cssText = `
                    position: fixed;
                    pointer-events: none;
                    z-index: 999;
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                    background: radial-gradient(circle, rgba(247,183,49,0.6), transparent 70%);
                    left: ${e.clientX - 10}px;
                    top: ${e.clientY - 10}px;
                    transform: scale(0);
                    animation: clickGlow 0.8s ease-out forwards;
                `;
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 900);
        });

        // 注入点击动画
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
                @keyframes clickGlow {
                    0% { transform: scale(0); opacity: 1; }
                    100% { transform: scale(4); opacity: 0; }
                }
            `;
        document.head.appendChild(styleSheet);

        // ============================================================
        // 5. 控制台彩蛋
        // ============================================================
        console.log('✨ 光遇 · 生日礼物 ✨');
        console.log('🎂 祝 远哥哥 生日快乐！');
        console.log('🕯️ 点击按钮，开启光遇之旅');
    </script>

</body>
</html>
